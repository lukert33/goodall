# Runs the four quality gates from AGENTS.md ("Testing") on every pull request
# and on every push to main.
#
# Security choices a reader might otherwise undo (see docs/DEPENDENCIES.md):
# - `pull_request`, never `pull_request_target`: code from a pull request runs
#   with a read-only token and no access to secrets.
# - The token can only read the repository, and checkout does not keep it.
# - Actions are pinned to a full commit id; a tag can be moved, a commit cannot.
# - uv is installed from PyPI at an exact version and checked against its
#   sha256 hash, instead of through a third-party setup action.
# - uv versions below 0.13.4 trust a compromised certificate authority in their
#   bundled certificate list (GHSA-hq85-5cpj-mr62). The pinned uv is 0.13.7,
#   and the advisory states that 0.13.4 removed that authority from the bundled
#   list, so uv uses its own list again. The earlier `UV_NATIVE_TLS`
#   workaround is gone: it made the gates depend on the runner's system store
#   distrusting the same authority, which could not be checked.

name: Quality gates

on:
  # No branch filter: this repo stacks pull requests, so many target a branch
  # other than main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Goodall targets macOS, but the tests use only git, sh and Python, and
    # Linux runners are cheaper and quicker to start.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Use the runner's own Python 3.12 rather than downloading one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # Ubuntu's system Python refuses `pip install` outside a virtual
        # environment, so uv goes into its own. The hash is the PyPI wheel for
        # Linux x86_64; raise the version and this hash together with the one in
        # the menu-bar-icon job below, and keep the
        # version inside the uv_build range in pyproject.toml. 0.13.7 (uploaded
        # 2026-11-03) is the newest release in that range that was at least two
        # weeks old when it was pinned.
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-tool"
          echo "uv==0.13.7 --hash=sha256:2c9bdc4a872b60a93c5f26c0791089ea11585a4f9d3b3c017d78eb8487505e25" > "$RUNNER_TEMP/uv-requirements.txt"
          "$RUNNER_TEMP/uv-tool/bin/pip" install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/uv-requirements.txt"
          echo "$RUNNER_TEMP/uv-tool/bin" >> "$GITHUB_PATH"

      - name: Install dependencies from the lockfile
        # --locked fails if uv.lock does not match pyproject.toml. --extra
        # scout installs inspect-ai and inspect-scout, so the export tests
        # run instead of skipping; the tests that prove capture works without
        # them hide them from a fresh interpreter instead.
        run: uv sync --locked --extra scout

      - name: Tests
        run: uv run pytest

      - name: Stress tests
        # About 20 seconds. Heavy bursts against the telemetry receiver, with
        # every request accounted for; skipped by the plain test run above.
        run: uv run pytest -m stress

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

  menu-bar-icon:
    # Also runs the setup page's script tests, which need macOS's own
    # JavaScript (osascript) for the same reason.
    # The menu bar icon's helper is Swift (ADR 0024), which the Linux job above
    # cannot compile: there its tests are skipped. This job builds it on a Mac,
    # so a change that breaks the Swift fails the pull request, and runs the
    # tests that compile its model and check what the menu shows (ADR 0025).
    # The helper itself is built and never started.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the helper
        run: menu-bar-icon/build.sh "$RUNNER_TEMP/menu-bar-icon"

      - name: Check the signature
        run: codesign --verify --strict "$RUNNER_TEMP/menu-bar-icon/goodall.app"

      - name: Install uv
        # As in the job above, but the hash is the PyPI wheel for macOS on
        # Apple chips. Raise the version and both hashes together.
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-tool"
          echo "uv==0.13.7 --hash=sha256:f91a229093163eefca89ea1b220a221d64c3beade05d03519a6584d1797a5a5f" > "$RUNNER_TEMP/uv-requirements.txt"
          "$RUNNER_TEMP/uv-tool/bin/pip" install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/uv-requirements.txt"
          echo "$RUNNER_TEMP/uv-tool/bin" >> "$GITHUB_PATH"

      - name: Install dependencies from the lockfile
        # No scout extra: these tests need only goodall itself. uv may fetch
        # Python 3.12 here, since the Mac runner's own Python can be older.
        run: uv sync --locked

      - name: Menu bar icon tests
        run: uv run pytest tests/test_menu_bar_icon_model.py tests/test_menu_bar_icon_helper.py tests/test_menu_bar_icon.py

      - name: Setup page script tests
        # The setup page's script is run with osascript, which only macOS
        # has, so the Linux job skips these (goodall.setup_page).
        run: uv run pytest tests/test_setup_page_script.py
